# Environment for everything in remarks_vs_answers/.
#
# Python packages are pinned to the versions in the earlier stages' uv.lock files
# (text_embeddings, audio_embeddings, modelling), so round 3 reuses their code under the
# same versions that produced rounds 1-2. ffmpeg comes from conda-forge, so no system
# install is needed.
#
#   conda env create -f environment.yml
#   conda activate remarks_vs_answers
name: remarks_vs_answers
channels:
  - conda-forge
dependencies:
  - python=3.13
  - ffmpeg
  - pip
  - pip:
      - numpy==2.5.3
      - pandas==3.0.6
      - scipy==1.18.1
      - scikit-learn==1.9.1
      - joblib==1.6.0
      - pyarrow==25.0.1
      - matplotlib==3.11.2
      - torch==2.14.1
      - transformers==5.18.0
      - tokenizers==0.23.2
      - safetensors==0.8.0
      - huggingface-hub==1.33.0
      - praat-parselmouth==0.4.7
      - pytest==9.1.1
      - ipykernel==7.4.0
      - nbformat==5.11.1
      - nbconvert==7.17.1
